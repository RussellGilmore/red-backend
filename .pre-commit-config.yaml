repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        name: End of File Fixer
      - id: trailing-whitespace
        name: Trailing Whitespace Fixer
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2 # Get the latest from: https://github.com/antonbabenko/pre-commit-terraform/releases
    hooks:
      - id: terraform_fmt
        name: Terraform Formatter
  - repo: https://github.com/terraform-docs/terraform-docs
    rev: v0.19.0 # Get the latest from: https://github.com/terraform-docs/terraform-docs/releases
    hooks:
      - id: terraform-docs-go
        name: Generating Terraform Docs
        args:
          [
            "markdown",
            "table",
            "--output-file",
            "../README.md",
            "red-backend/.",
          ]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8 # Get the latest from: https://github.com/pre-commit/mirrors-prettier/tags
    hooks:
      - id: prettier
        name: Pretty Markdown
        args: [--prose-wrap=always]
        types_or: [markdown, yaml]
